services:
  db:
    image: postgres:16-alpine
    container_name: learnhanzi_auth_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/auth-service
    container_name: learnhanzi_auth_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ../services/auth-service:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  recognition:
    build:
      context: ../services/hanzi-recognition-service
    container_name: learnhanzi_recognition_api
    ports:
      - "8001:8001"
    volumes:
      - ../services/hanzi-recognition-service:/app
    env_file:
      - ../services/hanzi-recognition-service/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  auth_pgdata: