services:
  db:
    image: postgres:16-alpine
    container_name: learnhanzi_auth_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${DB_PORT}:5432" 
    volumes: 
      - auth_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/auth-service
    container_name: learnhanzi_auth_api
    env_file:
      - .env
      - ../services/auth-service/.env
    ports:
      - "8000:8000"
    volumes:
      - ../services/auth-service:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  recognition:
    build:
      context: ../services/hanzi-recognition-service
    container_name: learnhanzi_recognition_api
    ports:
      - "8001:8001"
    volumes:
      - ../services/hanzi-recognition-service:/app
    env_file:
      - ../services/hanzi-recognition-service/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  dictionary:
    build:
      context: ../services/dictionary-service
    container_name: learnhanzi_dictionary_api
    env_file:
      - .env
      - ../services/dictionary-service/.env
    ports:
      - "8002:8002"
    volumes:
      - ../services/dictionary-service:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload"

  progress:
    build:
      context: ../services/progress-service
    container_name: learnhanzi_progress_api
    env_file:
      - .env
      - ../services/progress-service/.env
    ports:
      - "8003:8003"
    volumes:
      - ../services/progress-service:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload"

volumes:
  auth_pgdata:
